###############################################################################
# Legends Chat — Production compose
#
# External Postgres and Redis are provided via DATABASE_URL / REDIS_URL.
# Copy .env.prod.example → .env.prod, fill in secrets, then:
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
###############################################################################
services:
  legends-chat:
    image: legends-chat:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      # ── Database & cache (external) ──────────────────────────────────────
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: "${REDIS_URL}"

      # ── Auth secrets (generate with: openssl rand -hex 32) ───────────────
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}"
      JWT_ACCESS_TTL_SECONDS: "${JWT_ACCESS_TTL_SECONDS:-900}"
      JWT_REFRESH_TTL_SECONDS: "${JWT_REFRESH_TTL_SECONDS:-86400}"

      # ── At-rest encryption (generate with: openssl rand -base64 32) ──────
      ENCRYPTION_MASTER_KEY: "${ENCRYPTION_MASTER_KEY}"

      # ── App ───────────────────────────────────────────────────────────────
      APP_PUBLIC_URL: "${APP_PUBLIC_URL}"
      NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL}"
      NODE_ENV: "production"

      # ── Push notifications (VAPID) ────────────────────────────────────────
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-mailto:admin@example.com}"

      # ── Telegram bot (optional) ───────────────────────────────────────────
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"

      # ── Email / SMTP (optional) ───────────────────────────────────────────
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-noreply@example.com}"

      # ── TOTP encryption key (optional) ────────────────────────────────────
      TOTP_ENCRYPTION_KEY: "${TOTP_ENCRYPTION_KEY:-}"
    volumes:
      - uploads:/app/uploads
    networks:
      - service-network

volumes:
  uploads:

networks:
  service-network:
    name: legendsnet
    external: true
