services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: legends
      POSTGRES_PASSWORD: legends
      POSTGRES_DB: legends
    # Bind to loopback only — a dev DB with trivial creds must never be
    # reachable off-host. The local dev app still connects via 127.0.0.1 (#21).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legends"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Loopback only — unauthenticated dev Redis is a known RCE vector if exposed.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
