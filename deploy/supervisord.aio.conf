[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# ── Infrastructure (start first) ────────────────────────────────────────────

[program:postgres]
command=postgres -D /data/postgres -c listen_addresses=127.0.0.1
user=postgres
priority=5
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=redis-server --dir /data/redis --save 3600 1 --save 300 100 --appendonly no --loglevel warning
priority=5
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ── Application ──────────────────────────────────────────────────────────────

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=30
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=node /app/web/apps/web/server.js
directory=/app/web
priority=20
autostart=true
autorestart=true
environment=NODE_ENV="production",PORT="3000",HOSTNAME="127.0.0.1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ws]
command=/bin/sh -c "node_modules/.bin/tsx apps/ws/src/index.ts"
directory=/app
priority=20
autostart=true
autorestart=true
environment=NODE_ENV="production"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:bot]
command=/bin/sh -c "node_modules/.bin/tsx apps/bot/src/index.ts"
directory=/app
priority=20
autostart=true
autorestart=true
startretries=3
environment=NODE_ENV="production"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
