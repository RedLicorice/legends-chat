worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;

    # Temp paths writable by non-root
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;

    client_max_body_size 55m;

    upstream next { server 127.0.0.1:3000; }
    upstream ws   { server 127.0.0.1:3001; }

    server {
        listen 80;

        # Socket.io — must come before the catch-all
        location /socket.io/ {
            proxy_pass         http://ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 3600s;
        }

        # General file attachments: force download, never inline execution.
        # Even if a mislabeled HTML/SVG lands here it cannot run as script in
        # our origin. (add_header does NOT inherit into nested locations, so the
        # cache/nosniff headers are repeated here deliberately.)
        location /uploads/files/ {
            alias /app/uploads/files/;
            types { }                       # no extension→MIME mapping...
            default_type application/octet-stream;   # ...serve everything as bytes
            add_header Cache-Control "public, max-age=31536000";
            add_header X-Content-Type-Options "nosniff";
            add_header Content-Disposition "attachment";
        }

        # Image buckets (avatars/gifs/uploads) render inline. Extensions are
        # server-derived from validated MIME (see apps/web/app/api/upload), and
        # nosniff pins the browser to the declared type — no HTML/SVG sniffing.
        location /uploads/ {
            alias /app/uploads/;
            add_header Cache-Control "public, max-age=31536000";
            add_header X-Content-Type-Options "nosniff";
        }

        location / {
            proxy_pass         http://next;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            # Pass the original protocol from the outer reverse proxy (e.g. CloudFlare/nginx)
            # rather than overwriting with the internal HTTP scheme.
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60s;
        }
    }
}
