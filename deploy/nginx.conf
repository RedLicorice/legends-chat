worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile     on;

    # Temp paths writable by non-root
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;

    client_max_body_size 55m;

    upstream next { server 127.0.0.1:3000; }
    upstream ws   { server 127.0.0.1:3001; }

    server {
        listen 80;

        # Socket.io — must come before the catch-all
        location /socket.io/ {
            proxy_pass         http://ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            # Same client-IP headers the / block forwards (audit #23). Without
            # them the ws process never sees a real peer address, so every limit
            # it applies is keyed per-account only — and anonymous sessions make
            # accounts cheap to mint, leaving no backstop for a connection flood.
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 3600s;
        }

        # General file attachments: force download, never inline execution.
        # Even if a mislabeled HTML/SVG lands here it cannot run as script in
        # our origin. (add_header does NOT inherit into nested locations, so the
        # cache/nosniff headers are repeated here deliberately.)
        location /uploads/files/ {
            alias /app/uploads/files/;
            types { }                       # no extension→MIME mapping...
            default_type application/octet-stream;   # ...serve everything as bytes
            add_header Cache-Control "public, max-age=31536000";
            add_header X-Content-Type-Options "nosniff";
            add_header Content-Disposition "attachment";
            # cr-m11: /uploads/* is served straight off disk and NEVER reaches
            # the Next app, so none of the headers next.config.mjs applies to
            # `/:path*` (CSP, X-Frame-Options, HSTS, Referrer-Policy) ever
            # covered it — uploads were same-origin content carrying the weakest
            # headers in the deployment. `add_header` does not inherit into a
            # location that declares any of its own, so the whole set has to be
            # repeated in BOTH upload locations, not referenced.
            add_header X-Frame-Options "DENY";
            add_header Referrer-Policy "no-referrer";
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains";
            # Nothing under /uploads/ needs to load a subresource or run script.
            # `sandbox` additionally drops the response into an opaque origin so
            # even a parser bug can't reach our cookies or localStorage.
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; sandbox";
        }

        # Image buckets (avatars/gifs/uploads) render inline. Extensions are
        # server-derived from the SNIFFED container type (see
        # apps/web/app/api/upload), and nosniff pins the browser to the declared
        # type — no HTML/SVG sniffing.
        location /uploads/ {
            alias /app/uploads/;
            add_header Cache-Control "public, max-age=31536000";
            add_header X-Content-Type-Options "nosniff";
            # cr-m11 — see the note in /uploads/files/ above. Repeated, not
            # inherited. `img-src 'self'` here rather than `default-src 'none'`
            # because these responses ARE images and must still render when a
            # browser navigates directly to one (lightbox "open in new tab").
            add_header X-Frame-Options "DENY";
            add_header Referrer-Policy "no-referrer";
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains";
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; sandbox";
        }

        location / {
            proxy_pass         http://next;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            # Pass the original protocol from the outer reverse proxy (e.g. CloudFlare/nginx)
            # rather than overwriting with the internal HTTP scheme.
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60s;
        }
    }
}
